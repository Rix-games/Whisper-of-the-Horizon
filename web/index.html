<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Šepot Horizontu</title>
  <meta name="description" content="Klidná inkrementální vesmírná hra postavená na skutečné fyzice. Od jednoho asteroidu až ke galaxiím.">
  <meta name="theme-color" content="#04050a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2304050a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23cfdcff'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='4' fill='none' stroke='%23f2a541' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css?v=1.0.0-alfa">
</head>
<body data-ch="1">
  <canvas id="scene" aria-label="Hlavní pohled"></canvas>

  <header id="top">
    <div class="brand">Šepot Horizontu</div>
    <button id="kblock" title="Kardaševova škála"><span id="kval" class="mono">K</span><span id="kpow" class="mono"></span></button>
    <div id="kprogw"><span id="kprog"></span><div class="bar"><b id="kbar"></b></div></div>
    <div id="res"></div>
    <div class="topr">
      <button class="icon" id="sndBtn" title="Zvuk"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
      <button class="icon" id="setBtn" title="Nastavení"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.5 7.5 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.5 7.5 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>
    </div>
  </header>

  <aside id="left">
    <div class="pane goal">
      <div class="chap" id="chTitle"></div>
      <div class="st" id="stName"></div>
      <div class="bar big"><b id="goalBar"></b></div>
      <div class="gl"><span id="goalTxt" class="mono"></span></div>
      <div class="need" id="goalNeed"></div>
      <div id="indic"></div>
      <dl id="stats"></dl>
    </div>
    <div class="pane logp">
      <div class="ph">Palubní deník</div>
      <div id="log"></div>
    </div>
  </aside>

  <aside id="dock">
    <button id="dockTog" title="Sbalit / rozbalit">›</button>
    <nav id="tabs"></nav>
    <div id="dockBody"></div>
  </aside>


  <p id="hint"></p>
  <nav id="ladder"></nav>
  <div id="toast" hidden></div>
  <div id="modal" hidden><div class="mcard"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="mact"><button class="btn" id="modalCancel" hidden></button><button class="btn pri" id="modalOk"></button></div></div></div>
  <noscript><p style="padding:24px;color:#e1e4f4">Hra potřebuje zapnutý JavaScript.</p></noscript>
  <script src="hra.js?v=1.0.0-alfa"></script>
</body>
</html>
