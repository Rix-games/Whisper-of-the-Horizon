<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Šepot Horizontu</title>
  <meta name="description" content="Klidná inkrementální vesmírná hra postavená na skutečné fyzice. Od jednoho asteroidu až k nadkupě galaxií.">
  <meta name="theme-color" content="#0a0c18">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230a0c18'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23cfdcff'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='4' fill='none' stroke='%23f2a541' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css?v=0.4.0b">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="brand-name">Šepot Horizontu</span>
        <button class="kblock" id="kblock" data-unit="K" aria-describedby="tip">
          <span class="kval" id="kval">K −0,33</span>
          <span class="kpow mono" id="kpow">500 W</span>
        </button>
        <div class="kprog">
          <span id="kprogLabel"></span>
          <div class="bar"><b id="kbar"></b></div>
        </div>
      </div>
      <div class="resbar" id="resbar"></div>
      <div class="clock">
        <span class="mono" id="clockDay"></span>
        <span class="mono dim" id="clockScale"></span>
        <button class="iconbtn" id="soundBtn" aria-pressed="false" aria-label="Zvuk"></button>
        <button class="iconbtn" id="settingsBtn" aria-label="Nastavení" aria-expanded="false" aria-controls="drawer">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.5 7.5 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.5 7.5 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
        </button>
      </div>
    </header>

    <main class="grid">
      <section class="panel rig" aria-labelledby="rigTitle">
        <div class="ph"><h2 id="rigTitle"></h2><span class="tag mono" id="clickTag"></span></div>
        <div class="body">
          <div class="event" id="event" hidden></div>
          <div class="rockwrap" id="rockwrap">
            <button id="rock" aria-label="Těžit rudu"><canvas id="rockc" width="520" height="520"></canvas></button>
          </div>
          <p class="hint" id="hint"></p>
          <dl class="stats" id="stats"></dl>
          <div class="voyage" id="voyage" hidden></div>
        </div>
      </section>

      <section class="panel scene" id="scene" aria-label="Černá díra a soustava">
        <div class="scene-wrap">
          <canvas id="scenec" aria-label="Černá díra s diskem. Klikni nebo drž v disku a vypustíš plyn z pasti."></canvas>
          <p class="scene-hint" id="sceneHint"></p>
          <button class="btn burst" id="burstBtn" data-burst="1"></button>
        </div>
      </section>

      <section class="panel ops" aria-label="Provoz">
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="view" id="view" role="tabpanel"></div>
        <div class="view bview" id="bview"></div>
      </section>

      <aside class="panel log" aria-labelledby="logTitle">
        <div class="ph"><h2 id="logTitle"></h2><span class="tag mono" id="logCount">0</span></div>
        <div class="entries" id="log"></div>
      </aside>
    </main>

    <nav class="chapters" id="chapters" aria-label="Kapitoly"></nav>
  </div>

  <div class="drawer" id="drawer" hidden>
    <aside class="drawer-card" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div class="ph"><h2 id="drawerTitle"></h2><button class="iconbtn" id="drawerClose"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2"/></svg></button></div>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>
  </div>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <p id="modalBody"></p>
      <div class="row modal-act"><button class="btn" id="modalOk"></button><button class="btn ghost" id="modalCancel" hidden></button></div>
    </div>
  </div>

  <noscript><p style="padding:24px;color:#e1e4f4">Hra potřebuje zapnutý JavaScript.</p></noscript>
  <script src="hra.js?v=0.4.0b"></script>
</body>
</html>
